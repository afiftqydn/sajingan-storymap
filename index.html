<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>When Forests Lose Their Boundaries — Sajingan Besar</title>
    <meta name="description" content="Investigasi ekspansi kebun sawit di Kecamatan Sajingan Besar, Kabupaten Sambas, Kalimantan Barat." />
    <script>
      // Set atribut data-theme SEBELUM React mount, supaya tidak ada
      // kedipan (flash) dari tema default ke tema tersimpan pengguna.
      (function () {
        try {
          var saved = localStorage.getItem('sajingan-storymap-theme');
          var theme = saved || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
